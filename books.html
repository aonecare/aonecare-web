<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A One Care Books</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f8ff;
margin:0;
}

header{
background:#0056b3;
color:white;
text-align:center;
padding:20px;
}

.container{
width:90%;
margin:30px auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
text-align:center;
}

.card img{
width:150px;
height:200px;
object-fit:cover;
}

.btn{
background:#0056b3;
color:white;
padding:10px 20px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:10px;
}

.btn:hover{
background:#003d80;
}
</style>

</head>

<body>

<header>
<h1>📚 A One Care Book Store</h1>
</header>

<div class="container">

<div class="card">
<img src="images/hsc-bangla.jpg" alt="ভোট একটি পবিত্র আমানত">

<h3>ভোট একটি পবিত্র আমানত</h3>

<p>৳450</p>
<button class="btn" onclick="addToCart('বাংলা বই',450)">🛒 Add to Cart</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/150x200?text=English+Book">
<h3>English Book</h3>
<p>৳500</p>
<button class="btn" onclick="addToCart('English Book',500)">🛒 Add to Cart</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/150x200?text=Math+Book">
<h3>Math Book</h3>
<p>৳550</p>
<button class="btn" onclick="addToCart('Math Book',550)">🛒 Add to Cart</button>
</div>

</div>

<script>
function addToCart(name,price){
alert(name + " কার্টে যোগ হয়েছে!\nমূল্য: ৳" + price);
}
</script>

</body>
</html>
